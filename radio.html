<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <div>
            choose subject <br>
            <input type="radio" name="sub" id="abcd" value="math">
            <label for="abcd">math</label>
            <input type="radio" name="sub" id="ab" value="scie">
            <label for="ab">scie</label>
        </div>
        <br>
        <div>
            favourite fruit <br>
            <input type="checkbox" name="fruit" id="ab" value="mango">
            <label for="ab">mango</label>
            <input type="checkbox" name="fruit" id="abc" value="grape">
            <label for="abc">grape</label>
            <input type="checkbox" name="fruit" id="abd" value="orange">
            <label for="abd">orange</label>
        </div> <br>
        <div>
            <select name="profession" id="profession">
                <option value="" selected>select your option</option>
                <option value="stu">student</option>
                <option value="eng">engineer</option>
                <option value="dev">developer</option>
            </select>
        </div>
        <br>
        <button>submit</button>
    </form>
</body>
</html>
